# Builds a pziOS test IPA with the two-thumb touch patch.
# It compiles the touch overlay (libglfw.dylib) and, optionally, the launcher (the app itself, which holds the touch
# editor) from this repository plus the patches here, then swaps them into the official release IPA. Everything else
# (Java runtime, graphics libraries, JIT helper) is kept from the official IPA. No Mac or game files needed.
# Run it from the Actions tab: "Build test IPA" -> "Run workflow". The IPA appears under Artifacts when it finishes.
name: Build test IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "pziOS release to patch (blank = the latest release)"
        required: false
        default: ""
      launcher:
        description: "Also rebuild the launcher, so the new switches appear in the touch editor"
        type: boolean
        default: true
      options:
        description: "Extra two-thumb options baked in, on top of the editor (blank = only what you set in the editor)"
        required: false
        default: ""
      runner:
        description: "Mac server type (try Intel if Apple-chip runs sit queued)"
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Apply the patches (top of the repo or test-patches/)
        run: |
          shopt -s nullglob
          PATCHES=(*.patch test-patches/*.patch)
          [ ${#PATCHES[@]} -gt 0 ] || { echo "::error::no .patch files found"; exit 1; }
          for p in "${PATCHES[@]}"; do
            if git apply --check "$p" 2>/dev/null; then git apply "$p"; echo "applied $p"
            elif git apply -R --check "$p" 2>/dev/null; then echo "already in the code: $p"
            else echo "::error::$p does not apply to this code"; exit 1; fi
          done

      - name: Download and unpack the official IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir dl
          gh release download $TAG --repo onlyknt/pziOS --pattern '*.ipa' --dir dl
          ls -la dl
          IPA=$(ls dl/*.ipa | grep -vi no-game-libs | head -1)
          [ -n "$IPA" ] || IPA=$(ls dl/*.ipa | head -1)
          [ -n "$IPA" ] || { echo "::error::no IPA found in that release"; exit 1; }
          echo "using $IPA"
          mkdir x && (cd x && unzip -q "../$IPA")
          APP=$(ls -d "$PWD"/x/Payload/*.app | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Build the touch overlay (libglfw.dylib)
        env:
          OPTS: ${{ inputs.options }}
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ESC=$(printf '%s' "$OPTS" | sed 's/\\/\\\\/g; s/"/\\"/g')
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 \
            -dynamiclib -fobjc-arc -O2 -install_name @rpath/libglfw.dylib "-DTT_OPTIONS=\"$ESC\"" \
            native/glfw-ios/glfw_ios.m \
            -framework UIKit -framework Foundation -framework QuartzCore -framework Metal \
            -framework CoreGraphics -framework ImageIO -framework GameController \
            -o libglfw.dylib
          ls -la libglfw.dylib

      - name: Build the launcher (app executable only)
        if: ${{ inputs.launcher }}
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          mkdir -p HostApp/Frameworks HostApp/runtime
          cp -R "$APP/Frameworks/MetalANGLE.framework" HostApp/Frameworks/        # only linked against; the official copy stays in the IPA
          # The JIT helper extension needs StikJIT, which isn't in this repository; the official, unchanged extension is kept instead.
          sed -i '' '/^      - target: ZomJITHelper$/d' HostApp/project.yml
          grep -q "target: ZomJITHelper" HostApp/project.yml && { echo "::error::could not drop the JIT helper dependency"; exit 1; }
          cd HostApp && xcodegen generate
          xcodebuild -project pziOS.xcodeproj -target pziOS -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/../build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            PZ_BUNDLE_ID=com.knt.pzios PZ_TEAM_ID="" PZ_DISPLAY_NAME=pziOS build | tail -25
          ls -la ../build/Release-iphoneos/pziOS.app/pziOS

      - name: Swap the new parts into the official IPA
        env:
          LAUNCHER: ${{ inputs.launcher }}
        run: |
          T=$(find "$APP" -name libglfw.dylib -print -quit)
          [ -n "$T" ] || { echo "::error::libglfw.dylib not found inside the IPA"; exit 1; }
          echo "replacing $T"
          # Warn if the official overlay has functions the public source doesn't (features the test build would lose)
          nm -gUj "$T" | sort > old-symbols.txt; nm -gUj libglfw.dylib | sort > new-symbols.txt
          MISSING=$(comm -23 old-symbols.txt new-symbols.txt)
          if [ -n "$MISSING" ]; then echo "::warning::the official overlay exports functions this build doesn't: $(echo $MISSING)"; fi
          cp libglfw.dylib "$T"; codesign -f -s - "$T"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")
          # The app's entitlements (increased memory limit, debugger access for JIT, ...) live in the official launcher's signature.
          # Save them before anything is replaced, and sign with them at the end: a rebuilt launcher has no signature to keep them from.
          ENT="$PWD/app-entitlements.plist"
          codesign -d --entitlements - --xml "$APP/$EXE" > "$ENT" 2>/dev/null || codesign -d --entitlements :- "$APP/$EXE" > "$ENT"
          [ -s "$ENT" ] || { echo "::error::could not read the official app's entitlements"; exit 1; }
          echo "official entitlements:"; plutil -p "$ENT"
          if [ "$LAUNCHER" = "true" ]; then
            echo "replacing the launcher executable $EXE"
            NEW=build/Release-iphoneos/pziOS.app/pziOS
            # Sanity checks, shown on the run page: the new editor is in it, and it links the same libraries as the official one
            otool -L "$APP/$EXE" | tail -n +2 | awk '{print $1}' | sort > old-libs.txt
            otool -L "$NEW" | tail -n +2 | awk '{print $1}' | sort > new-libs.txt
            EXTRA=$(comm -13 old-libs.txt new-libs.txt); GONE=$(comm -23 old-libs.txt new-libs.txt)
            [ -z "$EXTRA$GONE" ] || echo "::warning::launcher links differ. new: $(echo $EXTRA) / missing: $(echo $GONE)"
            # (Swift keeps strings under 16 bytes inline, so only longer ones can be found this way)
            for s in "Long press to lock" "Fire mode toggle"; do strings "$NEW" | grep -q "$s" || echo "::error::new launcher lacks '$s'"; done
            echo "::notice::launcher $(xcodebuild -version | head -1 | tr -d '\n'); $(lipo -archs "$NEW"); $(wc -c < "$APP/$EXE" | tr -d ' ') -> $(wc -c < "$NEW" | tr -d ' ') bytes; links $(wc -l < new-libs.txt | tr -d ' ') libraries"
            cp "$NEW" "$APP/$EXE"
          fi
          codesign -f -s - --entitlements "$ENT" "$APP"
          # Check the signed app kept every official entitlement (the memory limit one is why a rebuilt launcher crashed on an iPad)
          codesign -d --entitlements - --xml "$APP/$EXE" > signed-entitlements.plist 2>/dev/null || codesign -d --entitlements :- "$APP/$EXE" > signed-entitlements.plist
          for k in $(plutil -convert json -o - "$ENT" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin).keys()))'); do
            grep -q "<key>$k</key>" signed-entitlements.plist || { echo "::error::signed app lost the entitlement $k"; exit 1; }
          done
          grep -q "increased-memory-limit" signed-entitlements.plist && echo "::notice::entitlements kept: $(plutil -convert json -o - "$ENT" | python3 -c 'import json,sys; print(", ".join(k.split(".")[-1] for k in json.load(sys.stdin)))')" \
            || echo "::warning::the official app has no increased-memory-limit entitlement"
          (cd x && zip -qry ../pziOS-two-thumb-test.ipa Payload)
          ls -la pziOS-two-thumb-test.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: pziOS-two-thumb-test
          path: pziOS-two-thumb-test.ipa
          compression-level: 0
